<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MolineroApp - Sin conexión</title>
  <style>
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f9f9f6;
      color: #1a1c1b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .box { max-width: 380px; }
    .emoji { font-size: 56px; display: block; margin-bottom: 16px; }
    h1 { color: #0d631b; font-size: 26px; margin-bottom: 8px; }
    p { font-size: 18px; line-height: 1.5; color: #40493d; }
  </style>
</head>
<body>
  <div class="box">
    <span class="emoji">&#128376;&#65039;</span>
    <h1>Estás sin conexión</h1>
    <p>La app sigue funcionando igual. Tu lista de clientes, molinos y reparaciones está guardada en el teléfono. Volvé a entrar desde la pantalla de inicio.</p>
  </div>
</body>
</html>
